<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMSARPRAS UNPAM — Universitas Pamulang</title>
  <script src="assets/js/auth.js"></script>
  <script>
    // Arahkan berdasarkan sesi demo: dashboard jika ada, selain itu login.
    if (!Auth.storageUnavailable() && Auth.isAuthenticated()) {
      window.location.replace(Auth.DASHBOARD_PAGE);
    } else {
      window.location.replace(Auth.LOGIN_PAGE);
    }
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F7F8FA;
      font-family: "Plus Jakarta Sans", Arial, sans-serif;
      color: #111827;
    }
    .card {
      background: #ffffff;
      padding: 32px 40px;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgb(0 0 0 / 6%);
      text-align: center;
      max-width: 420px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: #6B7280; margin: 0 0 20px; }
    a {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      background: #2563EB;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    a:hover { background: #1D4ED8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SIMSARPRAS UNPAM</h1>
    <p>Mengarahkan…</p>
    <a href="login.html">Buka halaman login</a>
  </div>
</body>
</html>
